<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Under Maintenance</title>
<style>

    body {

      font-family: Arial, sans-serif;

      background-color: #f4f6f9;

      display: flex;

      justify-content: center;

      align-items: center;

      height: 100vh;

      margin: 0;

    }

    .container {

      background: #ffffff;

      padding: 40px;

      border-radius: 10px;

      text-align: center;

      box-shadow: 0 4px 10px rgba(0,0,0,0.1);

    }

    h1 {

      color: #2c3e50;

    }

    p {

      color: #555;

      font-size: 16px;

    }
</style>
</head>
<body>
<div class="container">
<h1>Website Under Maintenance</h1>
<p>This website is currently undergoing maintenance.</p>
<p>Please try again later.</p>
</div>
</body>
</html>
